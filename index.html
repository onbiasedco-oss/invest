<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>NACCI Members Club - Investment Education Platform</title>
    <meta name="description" content="A comprehensive web app for investment education, real-time market analysis, and content management with role-based access." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Mobile Web App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />

    <style>
      /* Prevent pull-to-refresh on mobile */
      html, body {
        overscroll-behavior-y: contain;
      }

        scroll-behavior: smooth;
        -webkit-tap-highlight-color: transparent;
      }

      @media screen and (max-width: 767px) {
        input, select, textarea {
          font-size: 16px !important;
        }
